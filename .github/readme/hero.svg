<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">RTAIP — Real-Time Analysis and Intelligence Platform</title>
  <desc id="desc">Animated night-sky banner with a wireframe globe, a satellite on an orbit, a rotating radar sweep and pulsing event markers beside the RTAIP title.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#020317"/>
      <stop offset=".52" stop-color="#071238"/>
      <stop offset="1" stop-color="#13052d"/>
    </linearGradient>
    <radialGradient id="purpleCloud">
      <stop stop-color="#d43cff" stop-opacity=".6"/>
      <stop offset=".34" stop-color="#8d22ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#4215a7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redCloud">
      <stop stop-color="#ff3b47" stop-opacity=".42"/>
      <stop offset=".4" stop-color="#ff3b47" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff3b47" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="goldCloud">
      <stop stop-color="#ffe69b" stop-opacity=".5"/>
      <stop offset=".3" stop-color="#ffce3a" stop-opacity=".2"/>
      <stop offset="1" stop-color="#b76f08" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="globe" cx=".38" cy=".34" r=".75">
      <stop stop-color="#1b2a63"/>
      <stop offset=".55" stop-color="#0a1238"/>
      <stop offset="1" stop-color="#050822"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a96b18"/>
      <stop offset=".28" stop-color="#ffe293"/>
      <stop offset=".55" stop-color="#ffce3a"/>
      <stop offset=".82" stop-color="#fff0b7"/>
      <stop offset="1" stop-color="#b87519"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffce3a" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffce3a" stop-opacity=".38"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".13"/>
      <stop offset=".45" stop-color="#af75ff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#ffce3a" stop-opacity=".05"/>
    </linearGradient>
    <pattern id="stars" width="150" height="110" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="18" r="1.2" fill="#fff7d4" opacity=".9"/>
      <circle cx="61" cy="36" r=".7" fill="#d7b5ff" opacity=".76"/>
      <circle cx="112" cy="17" r=".9" fill="#fff" opacity=".72"/>
      <circle cx="140" cy="68" r="1.1" fill="#ffd972" opacity=".8"/>
      <circle cx="83" cy="91" r=".55" fill="#fff" opacity=".58"/>
      <circle cx="31" cy="100" r=".75" fill="#c68cff" opacity=".78"/>
    </pattern>
    <filter id="blur" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dy="18" stdDeviation="20" flood-color="#000017" flood-opacity=".8"/></filter>
    <clipPath id="clip"><rect width="1200" height="420" rx="30"/></clipPath>
    <clipPath id="globeClip"><circle r="132"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="420" fill="url(#night)"/>
    <ellipse cx="280" cy="130" rx="330" ry="210" fill="url(#purpleCloud)" filter="url(#blur)">
      <animate attributeName="rx" values="300;370;300" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;1;.6" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="960" cy="230" rx="300" ry="200" fill="url(#goldCloud)" filter="url(#blur)">
      <animate attributeName="ry" values="170;230;170" dur="16s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1080" cy="90" rx="200" ry="140" fill="url(#redCloud)" filter="url(#blur)">
      <animate attributeName="opacity" values=".5;1;.5" dur="11s" repeatCount="indefinite"/>
    </ellipse>
    <rect x="-150" width="1500" height="520" fill="url(#stars)" opacity=".78">
      <animateTransform attributeName="transform" type="translate" values="0 0;150 0" dur="46s" repeatCount="indefinite"/>
    </rect>

    <!-- Globe -->
    <g transform="translate(940 212)">
      <circle r="132" fill="url(#globe)" stroke="url(#gold)" stroke-width="2"/>
      <g clip-path="url(#globeClip)" fill="none" stroke="#ffce3a" stroke-opacity=".32" stroke-width="1">
        <ellipse rx="132" ry="44"/>
        <ellipse rx="132" ry="92"/>
        <path d="M-132 0H132"/>
        <path d="M-122 -50H122M-122 50H122M-96 -90H96M-96 90H96" stroke-opacity=".2"/>
        <g>
          <ellipse rx="30" ry="132"/>
          <ellipse rx="76" ry="132"/>
          <ellipse rx="112" ry="132"/>
          <animateTransform attributeName="transform" type="scale" values="1 1;.2 1;1 1" dur="12s" repeatCount="indefinite"/>
        </g>
        <path d="M0 -132V132"/>
      </g>
      <!-- radar sweep -->
      <g clip-path="url(#globeClip)">
        <path d="M0 0L132 0A132 132 0 0 0 93 -93Z" fill="url(#sweep)">
          <animateTransform attributeName="transform" type="rotate" values="0;360" dur="9s" repeatCount="indefinite"/>
        </path>
      </g>
      <!-- event markers -->
      <g filter="url(#glow)">
        <circle cx="-48" cy="-38" r="4" fill="#ff3b47"/>
        <circle cx="-48" cy="-38" r="4" fill="none" stroke="#ff3b47" stroke-width="1.5">
          <animate attributeName="r" values="4;18" dur="2.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="52" cy="22" r="3.5" fill="#ffce3a"/>
        <circle cx="52" cy="22" r="3.5" fill="none" stroke="#ffce3a" stroke-width="1.5">
          <animate attributeName="r" values="3.5;16" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="-14" cy="64" r="3" fill="#ff3b47" opacity=".85">
          <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="88" cy="-60" r="3" fill="#ffce3a" opacity=".85">
          <animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- link lines (entity graph hint) -->
      <path d="M-48 -38L52 22L-14 64M52 22L88 -60" fill="none" stroke="#ffce3a" stroke-opacity=".45" stroke-dasharray="3 5"/>
      <!-- orbit + satellite -->
      <g transform="rotate(-22)">
        <ellipse rx="196" ry="58" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".8"/>
        <ellipse rx="220" ry="76" fill="none" stroke="#bc52ff" stroke-width="1" stroke-dasharray="2 12" opacity=".5"/>
        <g filter="url(#glow)">
          <rect x="-6" y="-3" width="12" height="6" rx="1.5" fill="#fff0b7"/>
          <rect x="-17" y="-2" width="9" height="4" fill="#ffce3a" opacity=".85"/>
          <rect x="8" y="-2" width="9" height="4" fill="#ffce3a" opacity=".85"/>
          <animateMotion dur="18s" repeatCount="indefinite" path="M196 0A196 58 0 1 1 -196 0A196 58 0 1 1 196 0"/>
        </g>
      </g>
    </g>

    <!-- Glass panel -->
    <g filter="url(#shadow)">
      <rect x="56" y="52" width="640" height="316" rx="28" fill="#060a25" fill-opacity=".58" stroke="url(#gold)" stroke-opacity=".82"/>
      <rect x="68" y="64" width="616" height="292" rx="22" fill="url(#glass)" stroke="#d38cff" stroke-opacity=".26"/>
    </g>
    <path d="M96 102H300" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="96" cy="102" r="5" fill="#ff3b47" filter="url(#glow)">
      <animate attributeName="opacity" values=".3;1;.3" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="316" y="107" fill="#f9d777" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" letter-spacing="3">OSINT + OPEN-GEO / LIVE</text>
    <text x="94" y="190" fill="url(#gold)" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="6">RTAIP</text>
    <text x="98" y="230" fill="#fff9e8" font-family="'JetBrains Mono', Consolas, monospace" font-size="17" font-weight="700" letter-spacing="3">REAL-TIME ANALYSIS &amp; INTELLIGENCE PLATFORM</text>
    <text x="98" y="270" fill="#d9c7f2" font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="17">A live globe and an investigation graph, built on public data only.</text>

    <g transform="translate(98 300)">
      <rect width="150" height="40" rx="20" fill="#2a0d1c" fill-opacity=".8" stroke="#ff3b47" stroke-opacity=".75"/>
      <circle cx="20" cy="20" r="5" fill="#ff3b47" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="34" y="25" fill="#ffd3d6" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">LIVE LAYERS</text>
    </g>
    <g transform="translate(262 300)">
      <rect width="148" height="40" rx="20" fill="#1d1732" fill-opacity=".8" stroke="#ffce3a" stroke-opacity=".65"/>
      <text x="20" y="25" fill="#ffe7a2" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">PROVENANCE</text>
    </g>
    <g transform="translate(424 300)">
      <rect width="196" height="40" rx="20" fill="#111331" fill-opacity=".8" stroke="#9f62ff" stroke-opacity=".66"/>
      <text x="20" y="25" fill="#dcc9ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11.5" letter-spacing="1.2">PUBLIC DATA ONLY</text>
    </g>

    <rect width="1200" height="420" rx="30" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <rect x="10" y="10" width="1180" height="400" rx="23" fill="none" stroke="#ff3b47" stroke-opacity=".14"/>
    <rect y="-40" width="1200" height="30" fill="#ffce3a" opacity=".045"><animate attributeName="y" values="-40;450" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
