name: Close stale issues

on:
  schedule:
    - cron: '30 1 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'blocked,needs design,phase 0,phase 1'
          stale-issue-message: >
            This issue has had no activity for 30 days and will be closed in 7
            days if nothing changes. Comment to keep it open.
          stale-pr-message: >
            This PR has had no activity for 30 days and will be closed in 7
            days. Push a commit or comment to keep it open.
